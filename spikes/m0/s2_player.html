<!doctype html>
<html lang="vi">
<meta charset="utf-8" />
<title>S2 MediaSource gapless</title>
<style>
  body { font-family: system-ui; margin: 24px; max-width: 760px }
  code { background: #eee; padding: 1px 4px }
  .pass { color: #0a7a3a } .fail { color: #b3261e }
</style>
<h1>S2: WebM/Opus chunks qua MediaSource</h1>
<p>
  Bộ: <a href="?set=sine&variant=A">sine A</a> · <a href="?set=sine&variant=B">sine B</a> ·
  <a href="?set=speech&variant=A">speech A</a> · <a href="?set=speech&variant=B">speech B</a>
</p>
<p id="info"></p>
<audio id="audio" controls></audio>
<p>
  Tốc độ:
  <select id="rate"><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option></select>
  <label><input type="checkbox" id="pitch" checked /> giữ cao độ</label>
</p>
<p id="boundaries"></p>
<pre id="log"></pre>
<script>
  const params = new URLSearchParams(location.search);
  const set = params.get('set') || 'sine';
  const variant = params.get('variant') || 'A';
  const base = `out/s2/${set}/`;
  const audio = document.getElementById('audio');
  const log = (m) => (document.getElementById('log').textContent += m + '\n');

  function append(sb, buf) {
    return new Promise((resolve, reject) => {
      sb.addEventListener('updateend', resolve, { once: true });
      sb.addEventListener('error', () => reject(new Error('SourceBuffer error')), { once: true });
      sb.appendBuffer(buf);
    });
  }

  function ranges(sb) {
    const out = [];
    for (let i = 0; i < sb.buffered.length; i++) out.push({ start: sb.buffered.start(i), end: sb.buffered.end(i) });
    return out;
  }

  async function run() {
    const manifest = await (await fetch(base + 'manifest.json')).json();
    document.getElementById('info').innerHTML =
      `Bộ <code>${set}</code>, biến thể <code>${variant}</code> (${variant === 'A' ? 'sequence mode' : 'segments + timestampOffset + appendWindow'}), ` +
      `${manifest.chunks.length} khối, tổng ${manifest.total.toFixed(3)}s. Hỗ trợ: ${MediaSource.isTypeSupported('audio/webm; codecs="opus"')}`;
    const ms = new MediaSource();
    audio.src = URL.createObjectURL(ms);
    await new Promise((r) => ms.addEventListener('sourceopen', r, { once: true }));
    const sb = ms.addSourceBuffer('audio/webm; codecs="opus"');
    sb.mode = variant === 'A' ? 'sequence' : 'segments';
    let offset = 0;
    for (const chunk of manifest.chunks) {
      const buf = await (await fetch(base + chunk.url)).arrayBuffer();
      if (variant === 'B') {
        sb.appendWindowEnd = Infinity;
        sb.appendWindowStart = offset;
        sb.appendWindowEnd = offset + chunk.duration;
        sb.timestampOffset = offset;
      }
      await append(sb, buf);
      log(`appended ${chunk.url} (${chunk.duration.toFixed(3)}s) -> ${JSON.stringify(ranges(sb).map((r) => [r.start.toFixed(4), r.end.toFixed(4)]))}`);
      offset += chunk.duration;
    }
    ms.endOfStream();
    const final = ranges(sb);
    const pass = final.length === 1 && final[0].start < 0.05 && Math.abs(final[0].end - manifest.total) < 0.05;
    window.__s2 = { variant, set, ranges: final, total: manifest.total, pass };
    log(`RESULT ${pass ? 'PASS' : 'FAIL'}: ${final.length} range(s), end=${final.length ? final[final.length - 1].end.toFixed(4) : 'n/a'}, expected=${manifest.total.toFixed(4)}`);
    document.getElementById('log').className = pass ? 'pass' : 'fail';

    const holder = document.getElementById('boundaries');
    let t = 0;
    manifest.chunks.slice(0, -1).forEach((chunk, i) => {
      t += chunk.duration;
      const at = t;
      const b = document.createElement('button');
      b.textContent = `Nghe ranh giới ${i + 1} (${at.toFixed(1)}s)`;
      b.onclick = () => { audio.currentTime = Math.max(0, at - 1.5); audio.play(); setTimeout(() => audio.pause(), 3000 / audio.playbackRate); };
      holder.appendChild(b);
    });
  }

  document.getElementById('rate').onchange = (e) => (audio.playbackRate = Number(e.target.value));
  document.getElementById('pitch').onchange = (e) => (audio.preservesPitch = e.target.checked);
  run().catch((e) => { log('ERROR ' + e.message); window.__s2 = { variant, set, error: e.message, pass: false }; });
</script>
</html>
