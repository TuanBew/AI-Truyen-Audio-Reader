name: CI

on:
  push:
    branches: [main, "rework/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # build generates next-env.d.ts (gitignored), which typecheck needs
      - run: npm run build
      - run: npm run typecheck
      # Reads .next/diagnostics/route-bundle-stats.json from the build above; needs no R2 or Supabase env.
      - name: Route JS budgets (first load, gzip)
        run: npm run check:bundle
      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser tests (MSE player, audio decode only; no audio device needed)
        # Vitest browser mode intermittently fails with "Cannot connect to the iframe" (about 1 run in 6, seen
        # locally with fileParallelism off too) or hangs, with every test passing on a rerun. Retry once, and bound
        # each attempt (a normal run takes under a minute) so a hang cannot eat the job timeout. The flake is tracked
        # as open, and a real production race could pass on the second attempt.
        run: timeout -k 10 240 npm run test:browser || timeout -k 10 240 npm run test:browser

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: ffmpeg (libopus) for the audio tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q -m "not db"

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes supabase@2.121.0 start
      - run: npx --yes supabase@2.121.0 test db
      - run: bash scripts/supabase-test-env.sh >> "$GITHUB_ENV"
      - name: Require TEST_SUPABASE_* (no silent db skips)
        run: |
          test -n "$TEST_SUPABASE_URL" \
            && test -n "$TEST_SUPABASE_ANON_KEY" \
            && test -n "$TEST_SUPABASE_SERVICE_ROLE_KEY"
      - uses: astral-sh/setup-uv@v6
      - name: ffmpeg (libopus) for the audio tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --locked
        working-directory: worker
      - name: Worker db tier (fails on any skip)
        working-directory: worker
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q -m db -rs | tee "$RUNNER_TEMP/db.txt"
          ! grep -q " skipped" "$RUNNER_TEMP/db.txt"
